# bit-labs Docker 编排
# 使用：在 deploy 目录执行
#   cp .env.example .env   # 按需修改
#   docker compose up -d
#
# 镜像需事先构建或加载，本 compose 不包含 build 段。
# 访问：http://localhost （Caddy → 静态 SPA + API 反代 Go）

name: bit-labs

services:
  postgres:
    image: postgres:18
    container_name: bit-labs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bit_labs}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bit_labs}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - bit-labs-net

  redis:
    image: redis:7-alpine
    container_name: bit-labs-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bit-labs-net

  server:
    image: ${BIT_LABS_IMAGE:-bit-labs:v1.0.0}
    container_name: bit-labs-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./conf:/app/conf
      - ./storage:/app/storage
      - .env:/app/.env
      - www_data:/export/www
    expose:
      - '8080'
    networks:
      - bit-labs-net

  caddy:
    image: caddy:2.9-alpine
    container_name: bit-labs-caddy
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - www_data:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - bit-labs-net

volumes:
  postgres_data:
  redis_data:
  www_data:
  caddy_data:
  caddy_config:

networks:
  bit-labs-net:
    driver: bridge
